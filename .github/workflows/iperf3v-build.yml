name: iperf3v build

on:
  push:
    branches: ['fork/**']
  pull_request:
    branches: ['fork/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and unit tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev
          ./configure --disable-shared
          make -j"$(nproc)"
          make check
      - name: Check version and --cntl-ka
        run: |
          src/iperf3 --version | head -1
          src/iperf3 --version | head -1 | grep -q -- '-v[0-9]'
          src/iperf3 --help | grep -q -- --cntl-ka
      - name: Watch script unit tests
        run: python3 -m unittest discover -s iperf3v/watch
      - name: fix commits apply on the ESnet base tag
        run: bash iperf3v/tests/check_fix_patches_apply.sh

  cygwin:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-core make libssl-devel zlib-devel
      - name: Build
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd "$GITHUB_WORKSPACE"
          ./configure --with-openssl=/usr | tee cfg.log
          grep -q 'TCP_KEEPIDLE socket option... yes' cfg.log
          make -j4
          B=src/.libs/iperf3.exe; [ -f "$B" ] || B=src/iperf3.exe
          "$B" --version | head -1
          "$B" --help | grep -q -- --cntl-ka
      - name: Loopback UDP server tests, one and several stream sockets
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd "$GITHUB_WORKSPACE"
          bash iperf3v/tests/windows_loopback.sh
      - name: Rate-limited sender does not spin (about 2.5 min)
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd "$GITHUB_WORKSPACE"
          bash iperf3v/tests/windows_throttle.sh
