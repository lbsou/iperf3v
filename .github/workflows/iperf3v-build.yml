name: iperf3v build

on:
  push:
    branches: ['fork/**']
  pull_request:
    branches: ['fork/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and unit tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev
          ./configure --disable-shared
          make -j"$(nproc)"
          make check
      - name: Check version and --cntl-ka
        run: |
          src/iperf3 --version | head -1
          src/iperf3 --version | head -1 | grep -q -- '-v[0-9]'
          src/iperf3 --help | grep -q -- --cntl-ka
      - name: Watch script unit tests
        run: python3 -m unittest discover -s iperf3v/watch
      - name: fix commits apply on the ESnet base tag
        run: bash iperf3v/tests/check_fix_patches_apply.sh

  linux-static:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Static package (Alpine, musl)
        run: |
          v=$(sed -n 's/^AC_INIT(\[iperf\],\[\([^]]*\)\].*/\1/p' configure.ac)
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 \
            sh -c "apk add -q bash && bash iperf3v/package-linux.sh $v"
      - name: Check that it is fully static and runs alone
        run: bash iperf3v/tests/check_static_linux.sh dist/iperf3v-*-linux-*.tar.gz

  cygwin:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-core make libssl-devel zlib-devel
      - name: Build
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd "$GITHUB_WORKSPACE"
          ./configure --with-openssl=/usr | tee cfg.log
          grep -q 'TCP_KEEPIDLE socket option... yes' cfg.log
          make -j4
          B=src/.libs/iperf3.exe; [ -f "$B" ] || B=src/iperf3.exe
          "$B" --version | head -1
          "$B" --help | grep -q -- --cntl-ka
      - name: Loopback UDP server tests, one and several stream sockets
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd "$GITHUB_WORKSPACE"
          bash iperf3v/tests/loopback_udp.sh
      - name: Rate-limited sender does not spin (about 2.5 min)
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd "$GITHUB_WORKSPACE"
          bash iperf3v/tests/loopback_throttle.sh

  macos:
    runs-on: macos-15   # oldest supported macOS: Homebrew's OpenSSL is built for the runner's version
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit tests
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          ./configure --disable-shared --with-openssl="$(brew --prefix openssl@3)" | tee cfg.log
          make -j"$(sysctl -n hw.ncpu)"
          make check
          src/iperf3 --version
      - name: Loopback UDP server tests, one and several stream sockets
        run: bash iperf3v/tests/loopback_udp.sh src/iperf3
      - name: Rate-limited sender does not spin (about 2.5 min)
        run: bash iperf3v/tests/loopback_throttle.sh src/iperf3
      - name: --cntl-ka sets the control connection keepalive
        run: |
          src/iperf3 -s -1 -p 5289 > /dev/null 2>&1 &
          sleep 1
          src/iperf3 -c 127.0.0.1 -p 5289 -t 1 --cntl-ka=20/5/3 -V | tee ka.log
          grep -q 'TCP_KEEPIDLE/TCP_KEEPINTVL/TCP_KEEPCNT are set to 20/5/3' ka.log
      - name: Package (static OpenSSL, --cntl-ka)
        run: |
          make distclean >/dev/null
          v=$(sed -n 's/^AC_INIT(\[iperf\],\[\([^]]*\)\].*/\1/p' configure.ac)
          bash iperf3v/package-macos.sh "$v"
