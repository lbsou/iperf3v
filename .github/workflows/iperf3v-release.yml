name: iperf3v release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Static package (Alpine, musl)
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 \
            sh -c "apk add -q bash && bash iperf3v/package-linux.sh ${GITHUB_REF_NAME#v}"
      - name: Check that it is fully static and runs alone
        run: bash iperf3v/tests/check_static_linux.sh "dist/iperf3v-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  cygwin:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-core make libssl-devel zlib-devel
      - name: Package
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd "$GITHUB_WORKSPACE"
          bash iperf3v/package-cygwin.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    needs: [linux, cygwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd dist && sha256sum -- * > SHA256SUMS && cd ..
          base=$(cat iperf3v/BASE_TAG)
          {
            echo "iperf3v ${GITHUB_REF_NAME#v}, basé sur ESnet iperf $base."
            echo
            echo "Série de patchs (un commit chacun, détail et statut en amont dans PATCHLOG) :"
            echo
            git log --reverse --format='- %s' "$base..$GITHUB_REF_NAME"
            echo
            echo "Problèmes connus : voir la section « Known issues » de PATCHLOG. Sommes SHA-256 : SHA256SUMS."
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "iperf3v ${GITHUB_REF_NAME#v}" --notes-file notes.md
